<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - Café Inventory Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --cream: #fffef4;
            --gold: #D4A574;
            --terracotta: #C85A3A;
            --brown: #4A3728;
            --light-brown: #6B5344;
            --accent: #8B6F47;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --bg-light: #f9f7f3;
            --bg-white: #ffffff;
            --text-dark: #4A3728;
            --text-light: #6B5344;
            --border: #D4A574;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--cream);
            padding: 20px;
            color: var(--text-dark);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--terracotta) 0%, var(--brown) 100%);
            color: var(--cream);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(200, 90, 58, 0.2);
        }
        .header h1 { font-size: 2.5em; font-weight: bold; }
        .header p { font-size: 1em; opacity: 0.95; margin-top: 5px; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .cafe-branding { display: flex; align-items: center; gap: 10px; }
        .cafe-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .logout-btn, .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: var(--cream);
            border: 1px solid var(--cream);
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
        .btn {
            background: var(--terracotta);
            color: white;
        }
        .btn:hover { background: var(--brown); transform: translateY(-2px); }
        .btn-secondary { background: var(--gold); color: var(--brown); }
        .btn-secondary:hover { background: var(--accent); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .role-badge {
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            color: var(--cream);
        }

        /* Login */
        .login-container {
            max-width: 500px;
            margin: 80px auto;
            background: var(--bg-white);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(200, 90, 58, 0.15);
            text-align: center;
            border-top: 4px solid var(--terracotta);
        }
        .login-logo { font-size: 4em; margin-bottom: 20px; }
        .login-title { font-size: 2em; font-weight: bold; color: var(--brown); margin-bottom: 10px; }
        .login-subtitle { color: var(--text-light); margin-bottom: 30px; }
        .login-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
        }
        .login-tab {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-light);
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .login-tab.active {
            color: var(--terracotta);
            border-bottom-color: var(--terracotta);
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--terracotta); }
        .form-input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 1em;
            color: var(--text-dark);
            background: var(--cream);
        }
        .form-input:focus, select:focus { outline: none; border-color: var(--terracotta); }

        /* Navigation */
        .nav-breadcrumb {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .nav-breadcrumb button {
            background: var(--gold);
            color: var(--brown);
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-breadcrumb > span {
            color: var(--text-light);
        }

        /* Dashboard Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--terracotta);
            box-shadow: 0 8px 20px rgba(200, 90, 58, 0.15);
        }
        .card-image { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .card-title { font-size: 1.1em; font-weight: bold; color: var(--brown); margin-bottom: 10px; }
        .card-subtitle { font-size: 0.9em; color: var(--text-light); }

        /* Item Detail */
        .item-detail {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .item-image { width: 100%; max-width: 300px; height: 300px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
        .stock-display {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--terracotta);
            margin: 20px 0;
        }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

        /* Admin Controls */
        .admin-section {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 4px solid var(--terracotta);
        }
        .admin-section h3 { color: var(--terracotta); margin-bottom: 15px; }

        /* Image Upload */
        .image-upload-section {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
            background: var(--cream);
        }
        .image-preview { margin-top: 15px; max-width: 200px; max-height: 200px; border-radius: 8px; }

        /* Stage Controls */
        .stage { display: none; }
        .stage.active { display: block; }

        /* Transactions */
        .transaction-log {
            background: var(--cream);
            border-radius: 12px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .transaction-item {
            background: var(--bg-white);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--gold);
            font-size: 0.9em;
        }
        .transaction-time { color: var(--text-light); font-size: 0.8em; }
        .transaction-user { font-weight: bold; color: var(--terracotta); }

        /* Responsive */
        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            .header h1 { font-size: 1.8em; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .item-detail { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Stage -->
        <div id="login-stage" class="stage active">
            <div class="login-container">
                <div class="login-logo">📦</div>
                <h1 class="login-title">ATLAS</h1>
                <p class="login-subtitle">Café Inventory Management</p>

                <div class="login-tabs">
                    <button class="login-tab active" onclick="switchLoginTab('admin')">Admin</button>
                    <button class="login-tab" onclick="switchLoginTab('staff')">Staff</button>
                    <button class="login-tab" onclick="switchLoginTab('audit')">Audit Manager</button>
                </div>

                <!-- Admin Login -->
                <div id="admin-login" class="login-form">
                    <div class="form-group">
                        <label class="form-label">Admin Email</label>
                        <input type="email" id="admin-email" class="form-input" placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Master Password</label>
                        <input type="password" id="admin-password" class="form-input" placeholder="Enter master password">
                    </div>
                    <button class="btn" onclick="loginAdmin()">Login as Admin</button>
                    <button class="btn-secondary" onclick="showAdminReset()" style="width: 100%; margin-top: 10px;">Forgot Password?</button>
                </div>

                <!-- Staff Login -->
                <div id="staff-login" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label class="form-label">Café Name</label>
                        <input type="text" id="staff-cafe" class="form-input" placeholder="e.g., Pause Cafe">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="staff-password" class="form-input" placeholder="Enter password">
                    </div>
                    <button class="btn" onclick="loginStaff()">Login as Staff</button>
                </div>

                <!-- Audit Manager Login -->
                <div id="audit-login" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label class="form-label">Café Name</label>
                        <input type="text" id="audit-cafe" class="form-input" placeholder="e.g., Pause Cafe">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="audit-password" class="form-input" placeholder="Enter password">
                    </div>
                    <button class="btn" onclick="loginAudit()">Login as Audit Manager</button>
                </div>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-stage" class="stage">
            <div class="header">
                <div>
                    <h1>ATLAS Admin</h1>
                    <p>Manage all cafés and system configuration</p>
                </div>
                <div class="header-right">
                    <span class="role-badge">👤 Admin</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div id="admin-content"></div>
        </div>

        <!-- Staff Dashboard -->
        <div id="staff-stage" class="stage">
            <div class="header">
                <div>
                    <h1 id="staff-cafe-name">Café Inventory</h1>
                    <p>Manage inventory and stock</p>
                </div>
                <div class="header-right">
                    <span class="role-badge" id="staff-role-badge">👤 Staff</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div id="staff-content"></div>
        </div>

        <!-- Audit Manager Dashboard -->
        <div id="audit-stage" class="stage">
            <div class="header">
                <div>
                    <h1 id="audit-cafe-name">Audit Manager</h1>
                    <p>Inventory review and structure management</p>
                </div>
                <div class="header-right">
                    <span class="role-badge">👤 Audit Manager</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div id="audit-content"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>

    <script>
// ============ FIREBASE INITIALIZATION ============
let db = null;
let firebaseReady = false;

function initializeFirebase() {
    const firebaseConfig = {
        databaseURL: "https://atlas-cafe-inventory-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    db = firebase.database();
    firebaseReady = true;
    console.log('Firebase initialized');
}

window.addEventListener('DOMContentLoaded', () => {
    try {
        initializeFirebase();
        setTimeout(() => {
            loadAllData();
            initializeListeners();
        }, 500);
    } catch (error) {
        console.warn('Firebase warning:', error);
        loadAllData();
    }
});

// ============ DATA STORAGE ============
let cafesData = {};
let transactionsData = [];
let currentUser = null;

function loadAllData() {
    try {
        const stored = localStorage.getItem('atlas_cafes') || '{}';
        cafesData = JSON.parse(stored);
        const txStored = localStorage.getItem('atlas_transactions') || '[]';
        transactionsData = JSON.parse(txStored);

        // Initialize with sample café if empty
        if (Object.keys(cafesData).length === 0) {
            console.log('Initializing with sample Pause Cafe');
            cafesData['Pause Cafe'] = {
                staffPassword: 'staff123',
                auditPassword: 'audit123',
                brandColor: '#C85A3A',
                departments: getDefaultDepartments(),
                inventory: {},
                createdDate: new Date().toISOString(),
                logo: '☕',
                backgroundImage: ''
            };
            saveAllData();
        }

        // FIX: If Pause Cafe exists but has no departments, reinitialize it
        if (cafesData['Pause Cafe']) {
            const pauseCafe = cafesData['Pause Cafe'];
            if (!pauseCafe.departments || Object.keys(pauseCafe.departments).length === 0) {
                console.log('Repairing Pause Cafe - adding default departments');
                pauseCafe.departments = getDefaultDepartments();
                pauseCafe.staffPassword = pauseCafe.staffPassword || 'staff123';
                pauseCafe.auditPassword = pauseCafe.auditPassword || 'audit123';
                pauseCafe.brandColor = pauseCafe.brandColor || '#C85A3A';
                pauseCafe.logo = pauseCafe.logo || '☕';
                pauseCafe.inventory = pauseCafe.inventory || {};
                saveAllData();
            }
        }
    } catch (e) {
        console.error('Load error:', e);
        cafesData = {
            'Pause Cafe': {
                staffPassword: 'staff123',
                auditPassword: 'audit123',
                brandColor: '#C85A3A',
                departments: getDefaultDepartments(),
                inventory: {},
                createdDate: new Date().toISOString(),
                logo: '☕',
                backgroundImage: ''
            }
        };
        transactionsData = [];
        saveAllData();
    }
}

function saveAllData() {
    try {
        localStorage.setItem('atlas_cafes', JSON.stringify(cafesData));
        localStorage.setItem('atlas_transactions', JSON.stringify(transactionsData));
        if (firebaseReady && db) {
            db.ref('cafes').set(cafesData);
            db.ref('transactions').set(transactionsData);
        }
    } catch (e) {
        console.error('Save error:', e);
    }
}

function initializeListeners() {
    if (!firebaseReady || !db) return;
    db.ref('cafes').on('value', snapshot => {
        if (snapshot.exists()) {
            cafesData = snapshot.val();
            if (currentUser) updateDisplay();
        }
    });
    db.ref('transactions').on('value', snapshot => {
        if (snapshot.exists()) {
            transactionsData = snapshot.val() || [];
            if (currentUser) updateDisplay();
        }
    });
}

function logTransaction(cafeName, action, details, userRole) {
    const transaction = {
        cafe: cafeName,
        action,
        details,
        role: userRole,
        timestamp: new Date().toLocaleString(),
        date: new Date().toISOString()
    };
    transactionsData.push(transaction);
    saveAllData();
}

// ============ LOGIN ============
function switchLoginTab(tab) {
    document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.login-form').forEach(f => f.style.display = 'none');
    event.target.classList.add('active');
    document.getElementById(tab + '-login').style.display = 'block';
}

function loginAdmin() {
    const email = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-password').value;

    // Get admin credentials from system settings
    const systemSettings = cafesData._system || {};
    const adminEmail = systemSettings.adminEmail || 'admin@atlascafe.com';
    const adminPassword = systemSettings.adminPassword || 'admin123';

    if (!email || !password) {
        alert('Please enter email and password');
        return;
    }

    if (email === adminEmail && password === adminPassword) {
        currentUser = { isAdmin: true, email: adminEmail };
        document.getElementById('login-stage').classList.remove('active');
        document.getElementById('admin-stage').classList.add('active');
        showAdminDashboard();
        logTransaction('SYSTEM', 'Admin Login', 'Administrator logged in (' + adminEmail + ')', 'Admin');
    } else {
        alert('Invalid email or password');
    }
}

function loginStaff() {
    const cafeName = document.getElementById('staff-cafe').value.trim();
    const password = document.getElementById('staff-password').value;
    if (!cafeName || !cafesData[cafeName]) {
        alert('Café not found');
        return;
    }
    if (cafesData[cafeName].staffPassword !== password) {
        alert('Invalid password');
        return;
    }
    currentUser = { cafeName, isStaff: true };
    document.getElementById('login-stage').classList.remove('active');
    document.getElementById('staff-stage').classList.add('active');
    document.getElementById('staff-cafe-name').textContent = cafeName;
    showStaffDashboard();
    logTransaction(cafeName, 'Staff Login', 'Staff logged in', 'Staff');
}

function loginAudit() {
    const cafeName = document.getElementById('audit-cafe').value.trim();
    const password = document.getElementById('audit-password').value;
    if (!cafeName || !cafesData[cafeName]) {
        alert('Café not found');
        return;
    }
    if (cafesData[cafeName].auditPassword !== password) {
        alert('Invalid password');
        return;
    }
    currentUser = { cafeName, isAudit: true };
    document.getElementById('login-stage').classList.remove('active');
    document.getElementById('audit-stage').classList.add('active');
    document.getElementById('audit-cafe-name').textContent = cafeName;
    showAuditDashboard();
    logTransaction(cafeName, 'Audit Login', 'Audit manager logged in', 'Audit Manager');
}

function logout() {
    currentUser = null;
    document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
    document.getElementById('login-stage').classList.add('active');
    document.getElementById('admin-email').value = '';
    document.getElementById('admin-password').value = '';
    document.getElementById('staff-cafe').value = '';
    document.getElementById('staff-password').value = '';
    document.getElementById('audit-cafe').value = '';
    document.getElementById('audit-password').value = '';
}

function showAdminReset() {
    const systemSettings = cafesData._system || {};
    const adminEmail = systemSettings.adminEmail || 'admin@atlascafe.com';

    let html = '<button class="btn-secondary" onclick="switchLoginTab(\'admin\')" style="margin-bottom: 20px;">← Back to Login</button>';
    html += '<h2 style="color: #C85A3A; margin-bottom: 20px;">Reset Admin Password</h2>';
    html += '<div class="admin-section"><h3>🔐 Password Recovery</h3>';
    html += '<p style="margin-bottom: 15px; color: #666;">Enter your email to verify and reset your password.</p>';
    html += '<div class="form-group"><label class="form-label">Email</label><input type="email" id="reset-email-input" class="form-input" placeholder="your@email.com" value="' + adminEmail + '"></div>';
    html += '<div class="form-group"><label class="form-label">New Password</label><input type="password" id="reset-password-input" class="form-input" placeholder="Enter new password"></div>';
    html += '<div class="form-group"><label class="form-label">Confirm Password</label><input type="password" id="reset-password-confirm" class="form-input" placeholder="Confirm new password"></div>';
    html += '<button class="btn" onclick="resetAdminPassword()">Reset Password</button></div>';
    html += '<div class="admin-section" style="background: #f0f8ff; border-left-color: #0066cc;"><h3 style="color: #0066cc;">ℹ️ Recovery Information</h3>';
    html += '<p style="color: #333;">Your admin email on file is: <strong>' + adminEmail + '</strong></p></div>';
    document.getElementById('login-stage').innerHTML = html;
}

function resetAdminPassword() {
    const email = document.getElementById('reset-email-input').value.trim();
    const newPassword = document.getElementById('reset-password-input').value;
    const confirmPassword = document.getElementById('reset-password-confirm').value;

    const systemSettings = cafesData._system || {};
    const adminEmail = systemSettings.adminEmail || 'admin@atlascafe.com';

    if (email !== adminEmail) {
        alert('Email does not match admin email on file');
        return;
    }

    if (!newPassword || !confirmPassword) {
        alert('Please enter new password');
        return;
    }

    if (newPassword !== confirmPassword) {
        alert('Passwords do not match');
        return;
    }

    if (newPassword.length < 6) {
        alert('Password must be at least 6 characters');
        return;
    }

    // Update admin password
    if (!cafesData._system) cafesData._system = {};
    cafesData._system.adminPassword = newPassword;
    cafesData._system.adminEmail = email;
    saveAllData();

    alert('Password reset successfully! Please login with your new password.');
    location.reload();
}

function updateAdminSettings() {
    const newEmail = document.getElementById('admin-email-input').value.trim();
    const currentPwd = document.getElementById('admin-current-pwd').value;
    const newPwd = document.getElementById('admin-new-pwd').value;
    const confirmPwd = document.getElementById('admin-confirm-pwd').value;

    if (!newEmail) {
        alert('Please enter an email');
        return;
    }

    if (!currentPwd) {
        alert('Please enter your current password');
        return;
    }

    // Verify current password
    const systemSettings = cafesData._system || {};
    const adminPassword = systemSettings.adminPassword || 'admin123';

    if (currentPwd !== adminPassword) {
        alert('Current password is incorrect');
        return;
    }

    // Update email
    if (!cafesData._system) cafesData._system = {};
    cafesData._system.adminEmail = newEmail;

    // Update password if provided
    if (newPwd) {
        if (newPwd !== confirmPwd) {
            alert('New passwords do not match');
            return;
        }
        if (newPwd.length < 6) {
            alert('Password must be at least 6 characters');
            return;
        }
        cafesData._system.adminPassword = newPwd;
    }

    saveAllData();
    alert('Admin settings updated successfully!');
    logTransaction('SYSTEM', 'Admin Settings Updated', 'Email: ' + newEmail + (newPwd ? ' | Password changed' : ''), 'Admin');
    showAdminDashboard();
}

// ============ ADMIN DASHBOARD ============
function showAdminDashboard() {
    const systemSettings = cafesData._system || {};
    const adminEmail = systemSettings.adminEmail || 'admin@atlascafe.com';

    let html = '<h2 style="color: #C85A3A; margin-bottom: 20px;">Admin Control Panel</h2>';
    html += '<div class="admin-section"><h3>👤 Admin Account Settings</h3>';
    html += '<div class="form-group"><label class="form-label">Admin Email</label><input type="email" id="admin-email-input" class="form-input" value="' + adminEmail + '"></div>';
    html += '<div class="form-group"><label class="form-label">Current Password</label><input type="password" id="admin-current-pwd" class="form-input" placeholder="Enter current password"></div>';
    html += '<div class="form-group"><label class="form-label">New Password (leave blank to keep current)</label><input type="password" id="admin-new-pwd" class="form-input" placeholder="Enter new password"></div>';
    html += '<div class="form-group"><label class="form-label">Confirm New Password</label><input type="password" id="admin-confirm-pwd" class="form-input" placeholder="Confirm new password"></div>';
    html += '<button class="btn" onclick="updateAdminSettings()">Update Admin Settings</button></div>';
    html += '<h2 style="color: #C85A3A; margin-bottom: 20px;">Manage Cafés</h2>';

function createNewCafe() {
    const name = document.getElementById('new-cafe-name').value.trim();

function updateCafeBrand(cafeName) {
    const color = document.getElementById('brand-color-input').value;

    alert('Branding updated!');

function updateCafeSecuritySettings(cafeName) {
    const newUsername = document.getElementById('cafe-username-input').value.trim();
    const email = document.getElementById('cafe-email-input').value.trim();
    const staffPwd = document.getElementById('staff-pwd-input').value;
    const auditPwd = document.getElementById('audit-pwd-input').value;

    if (!newUsername || !staffPwd || !auditPwd) {
        alert('Please fill all required fields');
        return;
    }

    // If café name changed, update the data structure
    if (newUsername !== cafeName) {
        if (cafesData[newUsername]) {
            alert('Café name already exists');
            return;
        }
        cafesData[newUsername] = cafesData[cafeName];
        delete cafesData[cafeName];
        currentUser.cafeName = newUsername;
        document.getElementById('staff-cafe-name').textContent = newUsername;
    }

    cafesData[newUsername].staffPassword = staffPwd;
    cafesData[newUsername].auditPassword = auditPwd;
    cafesData[newUsername].email = email;

    saveAllData();
    alert('Security settings updated!');
    editCafe(newUsername);
    logTransaction(newUsername, 'Security Updated', 'Passwords and email updated', 'Admin');
}

function staffStockIn(deptName, sectionName, itemName) {
    const qty = parseInt(document.getElementById('qty-input').value) || 1;
    const itemId = deptName + '|' + sectionName + '|' + itemName;
    const cafe = cafesData[currentUser.cafeName];

    if (!cafe.inventory[itemId]) cafe.inventory[itemId] = { stock: 0, minimum: 5, unitsPerBox: 1 };

    const oldStock = cafe.inventory[itemId].stock;
    cafe.inventory[itemId].stock += qty;
    saveAllData();

    logTransaction(currentUser.cafeName, 'Stock In', itemName + ': ' + oldStock + ' → ' + cafe.inventory[itemId].stock, 'Staff');
    selectStaffItem(deptName, sectionName, itemName);
}

function staffStockOut(deptName, sectionName, itemName) {
    const qty = parseInt(document.getElementById('qty-input').value) || 1;
    const itemId = deptName + '|' + sectionName + '|' + itemName;
    const cafe = cafesData[currentUser.cafeName];

    if (!cafe.inventory[itemId] || cafe.inventory[itemId].stock < qty) {
        alert('Insufficient stock');
        return;
    }

    const oldStock = cafe.inventory[itemId].stock;
    cafe.inventory[itemId].stock -= qty;
    saveAllData();

    logTransaction(currentUser.cafeName, 'Stock Out', itemName + ': ' + oldStock + ' → ' + cafe.inventory[itemId].stock, 'Staff');
    selectStaffItem(deptName, sectionName, itemName);
}

function auditStockIn(deptName, sectionName, itemName) {
    const qty = parseInt(document.getElementById('qty-input').value) || 1;
    const itemId = deptName + '|' + sectionName + '|' + itemName;
    const cafe = cafesData[currentUser.cafeName];

    if (!cafe.inventory[itemId]) cafe.inventory[itemId] = { stock: 0, minimum: 5, unitsPerBox: 1 };

    const oldStock = cafe.inventory[itemId].stock;
    cafe.inventory[itemId].stock += qty;
    saveAllData();

    logTransaction(currentUser.cafeName, 'Stock In', itemName + ': ' + oldStock + ' → ' + cafe.inventory[itemId].stock, 'Audit Manager');
    selectAuditItem(deptName, sectionName, itemName);
}

function auditStockOut(deptName, sectionName, itemName) {
    const qty = parseInt(document.getElementById('qty-input').value) || 1;
    const itemId = deptName + '|' + sectionName + '|' + itemName;
    const cafe = cafesData[currentUser.cafeName];

    if (!cafe.inventory[itemId] || cafe.inventory[itemId].stock < qty) {
        alert('Insufficient stock');
        return;
    }

    const oldStock = cafe.inventory[itemId].stock;
    cafe.inventory[itemId].stock -= qty;
    saveAllData();

    logTransaction(currentUser.cafeName, 'Stock Out', itemName + ': ' + oldStock + ' → ' + cafe.inventory[itemId].stock, 'Audit Manager');
    selectAuditItem(deptName, sectionName, itemName);
}

function saveAuditSettings(deptName, sectionName, itemName) {
    const itemId = deptName + '|' + sectionName + '|' + itemName;
    const cafe = cafesData[currentUser.cafeName];

    cafe.inventory[itemId].minimum = parseInt(document.getElementById('min-input').value) || 5;
    cafe.inventory[itemId].unitsPerBox = parseInt(document.getElementById('units-per-box').value) || 1;

    saveAllData();
    alert('Settings saved!');
    selectAuditItem(deptName, sectionName, itemName);
}

function showAuditSettings() {
    const cafe = cafesData[currentUser.cafeName];
    const brandColor = cafe.brandColor || '#C85A3A';
    let html = '<button class="btn-secondary" onclick="showAuditDashboard()" style="margin-bottom: 20px;">← Back</button>';
    html += '<h2 style="color: ' + brandColor + '; margin-bottom: 20px;">Audit Manager Settings</h2>';

    html += '<div class="admin-section"><h3>🔐 Password Management</h3>';
    html += '<div class="form-group"><label class="form-label">Staff Password</label><input type="password" id="audit-staff-pwd-input" class="form-input" value="' + cafe.staffPassword + '"></div>';
    html += '<div class="form-group"><label class="form-label">Audit Manager Password (your password)</label><input type="password" id="audit-audit-pwd-input" class="form-input" value="' + cafe.auditPassword + '"></div>';
    html += '<button class="btn" onclick="updateAuditPasswords()">Update Passwords</button></div>';

    document.getElementById('audit-content').innerHTML = html;
}

function updateAuditPasswords() {
    const staffPwd = document.getElementById('audit-staff-pwd-input').value;
    const auditPwd = document.getElementById('audit-audit-pwd-input').value;

    if (!staffPwd || !auditPwd) {
        alert('Please fill all required fields');
        return;
    }

    const cafe = cafesData[currentUser.cafeName];
    cafe.staffPassword = staffPwd;
    cafe.auditPassword = auditPwd;

    saveAllData();
    alert('Passwords updated!');
    logTransaction(currentUser.cafeName, 'Audit Settings Updated', 'Staff and Audit passwords changed by Audit Manager', 'Audit Manager');
    showAuditSettings();
}

    const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

    html += '<div class="admin-section"><h3>📅 Select Date Range</h3>';
    html += '<div class="form-group"><label class="form-label">Start Date</label><input type="date" id="audit-start-date" class="form-input" value="' + thirtyDaysAgo + '"></div>';
    html += '<div class="form-group"><label class="form-label">End Date</label><input type="date" id="audit-end-date" class="form-input" value="' + today + '"></div>';
    html += '<div class="form-group"><label class="form-label">Report Name/Month</label><input type="text" id="audit-report-name" class="form-input" placeholder="e.g., October 2026 Audit"></div></div>';

    html += '<div class="admin-section"><h3>🏷️ Filter by Department (Optional)</h3>';

    html += '<select id="audit-filter-dept" class="form-input" onchange="updateAuditSectionFilter()"><option value="">All Departments</option>';
    for (const deptName in cafe.departments) {
        if (!deptName.startsWith('_')) {
            html += '<option value="' + deptName + '">' + deptName + '</option>';
        }
    }
    html += '</select></div>';

    html += '<div class="admin-section"><h3>📂 Filter by Category/Section (Optional)</h3>';
    html += '<label class="form-label">Select Category (leave empty for all)</label>';
    html += '<select id="audit-filter-section" class="form-input" onchange="updateAuditItemFilter()"><option value="">All Categories</option></select></div>';

    html += '<div class="admin-section"><h3>📦 Filter by Item (Optional)</h3>';
    html += '<label class="form-label">Select Item (leave empty for all)</label>';
    html += '<select id="audit-filter-item" class="form-input"><option value="">All Items</option></select></div>';

    html += '<div class="admin-section"><button class="btn" onclick="downloadAuditReport()">📥 Download Audit Report</button></div>';

    html += '<div class="admin-section" style="background: #f0f8ff; border-left-color: #0066cc;"><h3 style="color: #0066cc;">ℹ️ Report Information</h3>';
    html += '<p style="font-size: 0.95em; color: #333;">The audit report will include:</p>';
    html += '<ul style="margin-left: 20px; color: #333;"><li>All transactions for selected date range</li><li>Stock In/Out activities by department/category</li><li>Current inventory snapshot</li><li>Password changes and security updates</li><li>Café configuration changes</li><li>User activities by role</li></ul></div>';

    document.getElementById('audit-content').innerHTML = html;

function updateAuditSectionFilter() {
    const cafe = cafesData[currentUser.cafeName];
    const selectedDept = document.getElementById('audit-filter-dept').value;
    const sectionSelect = document.getElementById('audit-filter-section');

    sectionSelect.innerHTML = '<option value="">All Categories</option>';

    if (selectedDept && cafe.departments[selectedDept]) {
        const dept = cafe.departments[selectedDept];
        for (const sectionName in dept) {
            if (!sectionName.startsWith('_')) {
                const option = document.createElement('option');
                option.value = sectionName;
                option.textContent = sectionName;
                sectionSelect.appendChild(option);
            }
        }
    }
    updateAuditItemFilter();
}

function updateAuditItemFilter() {
    const cafe = cafesData[currentUser.cafeName];
    const selectedDept = document.getElementById('audit-filter-dept').value;
    const selectedSection = document.getElementById('audit-filter-section').value;
    const itemSelect = document.getElementById('audit-filter-item');

    itemSelect.innerHTML = '<option value="">All Items</option>';

    if (selectedDept && selectedSection && cafe.departments[selectedDept] && cafe.departments[selectedDept][selectedSection]) {
        const section = cafe.departments[selectedDept][selectedSection];
        for (const itemName in section) {
            if (!itemName.startsWith('_')) {
                const option = document.createElement('option');
                option.value = itemName;
                option.textContent = itemName;
                itemSelect.appendChild(option);
            }
        }
    }
}

function downloadAuditReport() {
    const startDate = document.getElementById('audit-start-date').value;
    const endDate = document.getElementById('audit-end-date').value;
    const reportName = document.getElementById('audit-report-name').value || currentUser.cafeName + ' Audit Report';
    const filterDept = document.getElementById('audit-filter-dept').value;
    const filterSection = document.getElementById('audit-filter-section').value;
    const filterItem = document.getElementById('audit-filter-item').value;

    if (!startDate || !endDate) {
        alert('Please select both start and end dates');
        return;
    }

    const start = new Date(startDate);
    const end = new Date(endDate);

    if (start > end) {
        alert('Start date must be before end date');
        return;
    }

    // Filter transactions for the café, date range, and selected department/section/item
    const cafeTxs = transactionsData.filter(t => {
        if (t.cafe !== currentUser.cafeName) return false;
        const txDate = new Date(t.date);
        if (!(txDate >= start && txDate <= end)) return false;

        // If filters are selected, check if transaction matches
        if (filterDept || filterSection || filterItem) {
            const details = t.details;
            if (filterItem && !details.includes(filterItem)) return false;
            if (filterSection && !details.includes(filterSection)) return false;
            if (filterDept && !details.includes(filterDept)) return false;
        }
        return true;
    });

    // Get current inventory status with filtering
    const cafe = cafesData[currentUser.cafeName];
    let inventorySnapshot = [];
    for (const itemId in cafe.inventory) {
        const item = cafe.inventory[itemId];
        const [dept, section, name] = itemId.split('|');

        // Apply filters
        if (filterDept && dept !== filterDept) continue;
        if (filterSection && section !== filterSection) continue;
        if (filterItem && name !== filterItem) continue;

        inventorySnapshot.push({
            department: dept,
            section: section,
            item: name,
            currentStock: item.stock,
            minimum: item.minimum,
            unitsPerBox: item.unitsPerBox
        });
    }

    // Generate CSV
    let csv = 'ATLAS AUDIT REPORT\n';
    csv += 'Café: ' + currentUser.cafeName + '\n';
    csv += 'Report Name: ' + reportName + '\n';
    csv += 'Date Range: ' + startDate + ' to ' + endDate + '\n';
    if (filterDept || filterSection || filterItem) {
        csv += 'Filters Applied: ';
        const filters = [];
        if (filterDept) filters.push('Department: ' + filterDept);
        if (filterSection) filters.push('Category: ' + filterSection);
        if (filterItem) filters.push('Item: ' + filterItem);
        csv += filters.join(' | ') + '\n';
    }
    csv += 'Generated: ' + new Date().toLocaleString() + '\n';
    csv += 'Total Transactions: ' + cafeTxs.length + '\n\n';

    csv += '=== TRANSACTIONS ===\n';
    csv += 'Timestamp,Action,Details,User Role\n';
    for (const tx of cafeTxs) {
        csv += '"' + tx.timestamp + '","' + tx.action + '","' + tx.details.replace(/"/g, '""') + '","' + tx.role + '"\n';
    }

    csv += '\n=== CURRENT INVENTORY SNAPSHOT ===\n';
    csv += 'Department,Section,Item,Current Stock,Minimum,Units Per Box\n';
    for (const inv of inventorySnapshot) {
        csv += '"' + inv.department + '","' + inv.section + '","' + inv.item + '",' + inv.currentStock + ',' + inv.minimum + ',' + inv.unitsPerBox + '\n';
    }

    // Create download
    const element = document.createElement('a');
    element.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv));
    element.setAttribute('download', reportName.replace(/\s+/g, '_') + '_' + startDate + '_to_' + endDate + '.csv');
    element.style.display = 'none';
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);

    alert('Audit report downloaded successfully!');
    logTransaction(currentUser.cafeName, 'Audit Report Exported', 'Report: ' + reportName + ' (' + startDate + ' to ' + endDate + ')', 'Audit Manager');
    showAuditDashboard();
}

// ============ UTILITIES ============
function formatStock(item) {
    if (!item) return '0 units';
    const stock = item.stock || 0;
    const unitsPerBox = item.unitsPerBox || 1;
    const boxes = Math.floor(stock / unitsPerBox);
    const units = stock % unitsPerBox;

    if (unitsPerBox === 1) return stock + ' units';
    if (units === 0) return stock + ' units (' + boxes + ' boxes)';
    return stock + ' units (' + boxes + ' boxes + ' + units + ' units)';
}
