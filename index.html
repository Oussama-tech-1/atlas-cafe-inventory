<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - Café Inventory Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --cream: #fffef4;
            --gold: #D4A574;
            --terracotta: #C85A3A;
            --brown: #4A3728;
            --light-brown: #6B5344;
            --accent: #8B6F47;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --bg-light: #f9f7f3;
            --bg-white: #ffffff;
            --text-dark: #4A3728;
            --text-light: #6B5344;
            --border: #D4A574;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--cream);
            padding: 20px;
            color: var(--text-dark);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--terracotta) 0%, var(--brown) 100%);
            color: var(--cream);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(200, 90, 58, 0.2);
        }
        .header h1 { font-size: 2.5em; font-weight: bold; }
        .header p { font-size: 1em; opacity: 0.95; margin-top: 5px; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .cafe-branding { display: flex; align-items: center; gap: 10px; }
        .cafe-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .logout-btn, .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: var(--cream);
            border: 1px solid var(--cream);
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
        .btn {
            background: var(--terracotta);
            color: white;
        }
        .btn:hover { background: var(--brown); transform: translateY(-2px); }
        .btn-secondary { background: var(--gold); color: var(--brown); }
        .btn-secondary:hover { background: var(--accent); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .role-badge {
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            color: var(--cream);
        }

        /* Login */
        .login-container {
            max-width: 500px;
            margin: 80px auto;
            background: var(--bg-white);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(200, 90, 58, 0.15);
            text-align: center;
            border-top: 4px solid var(--terracotta);
        }
        .login-logo { font-size: 4em; margin-bottom: 20px; }
        .login-title { font-size: 2em; font-weight: bold; color: var(--brown); margin-bottom: 10px; }
        .login-subtitle { color: var(--text-light); margin-bottom: 30px; }
        .login-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
        }
        .login-tab {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-light);
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .login-tab.active {
            color: var(--terracotta);
            border-bottom-color: var(--terracotta);
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--terracotta); }
        .form-input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 1em;
            color: var(--text-dark);
            background: var(--cream);
        }
        .form-input:focus, select:focus { outline: none; border-color: var(--terracotta); }

        /* Navigation */
        .nav-breadcrumb {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .nav-breadcrumb button {
            background: var(--gold);
            color: var(--brown);
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-breadcrumb > span {
            color: var(--text-light);
        }

        /* Dashboard Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--terracotta);
            box-shadow: 0 8px 20px rgba(200, 90, 58, 0.15);
        }
        .card-image { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .card-title { font-size: 1.1em; font-weight: bold; color: var(--brown); margin-bottom: 10px; }
        .card-subtitle { font-size: 0.9em; color: var(--text-light); }

        /* Item Detail */
        .item-detail {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .item-image { width: 100%; max-width: 300px; height: 300px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
        .stock-display {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--terracotta);
            margin: 20px 0;
        }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

        /* Admin Controls */
        .admin-section {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 4px solid var(--terracotta);
        }
        .admin-section h3 { color: var(--terracotta); margin-bottom: 15px; }

        /* Image Upload */
        .image-upload-section {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
            background: var(--cream);
        }
        .image-preview { margin-top: 15px; max-width: 200px; max-height: 200px; border-radius: 8px; }

        /* Stage Controls */
        .stage { display: none; }
        .stage.active { display: block; }

        /* Transactions */
        .transaction-log {
            background: var(--cream);
            border-radius: 12px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .transaction-item {
            background: var(--bg-white);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--gold);
            font-size: 0.9em;
        }
        .transaction-time { color: var(--text-light); font-size: 0.8em; }
        .transaction-user { font-weight: bold; color: var(--terracotta); }

        /* Responsive */
        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            .header h1 { font-size: 1.8em; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .item-detail { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Stage -->
        <div id="login-stage" class="stage active">
            <div class="login-container">
                <div class="login-logo">📦</div>
                <h1 class="login-title">ATLAS</h1>
                <p class="login-subtitle">Café Inventory Management</p>

                <div class="login-tabs">
                    <button class="login-tab active" onclick="switchLoginTab('admin')">Admin</button>
                    <button class="login-tab" onclick="switchLoginTab('staff')">Staff</button>
                    <button class="login-tab" onclick="switchLoginTab('audit')">Audit Manager</button>
                </div>

                <!-- Admin Login -->
                <div id="admin-login" class="login-form">
                    <div class="form-group">
                        <label class="form-label">Master Password</label>
                        <input type="password" id="admin-password" class="form-input" placeholder="Enter master password">
                    </div>
                    <button class="btn" onclick="loginAdmin()">Login as Admin</button>
                </div>

                <!-- Staff Login -->
                <div id="staff-login" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label class="form-label">Café Name</label>
                        <input type="text" id="staff-cafe" class="form-input" placeholder="e.g., Pause Cafe">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="staff-password" class="form-input" placeholder="Enter password">
                    </div>
                    <button class="btn" onclick="loginStaff()">Login as Staff</button>
                </div>

                <!-- Audit Manager Login -->
                <div id="audit-login" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label class="form-label">Café Name</label>
                        <input type="text" id="audit-cafe" class="form-input" placeholder="e.g., Pause Cafe">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="audit-password" class="form-input" placeholder="Enter password">
                    </div>
                    <button class="btn" onclick="loginAudit()">Login as Audit Manager</button>
                </div>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-stage" class="stage">
            <div class="header">
                <div>
                    <h1>ATLAS Admin</h1>
                    <p>Manage all cafés and system configuration</p>
                </div>
                <div class="header-right">
                    <span class="role-badge">👤 Admin</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div id="admin-content"></div>
        </div>

        <!-- Staff Dashboard -->
        <div id="staff-stage" class="stage">
            <div class="header">
                <div>
                    <h1 id="staff-cafe-name">Café Inventory</h1>
                    <p>Manage inventory and stock</p>
                </div>
                <div class="header-right">
                    <span class="role-badge" id="staff-role-badge">👤 Staff</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div id="staff-content"></div>
        </div>

        <!-- Audit Manager Dashboard -->
        <div id="audit-stage" class="stage">
            <div class="header">
                <div>
                    <h1 id="audit-cafe-name">Audit Manager</h1>
                    <p>Inventory review and structure management</p>
                </div>
                <div class="header-right">
                    <span class="role-badge">👤 Audit Manager</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div id="audit-content"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
